<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportpedia | AI & C Powered Sports Encyclopedia</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Top Navigation Bar (Buttons visible by default) -->
    <nav class="navbar-glass d-flex justify-content-between align-items-center">
        <a href="/" class="brand-logo">🏆 Sportpedia</a>
        <div id="authArea">
            <button class="btn btn-sm btn-outline-primary rounded-pill px-3 me-2" onclick="openAuthModal(true)">Login</button>
            <button class="btn btn-sm btn-primary rounded-pill px-3" onclick="openAuthModal(false)">Create Account</button>
        </div>
    </nav>

    <!-- Hero & Voice Search Section -->
    <section class="hero-wrapper text-center">
        <div class="container" style="max-width: 720px;">
            <h1 class="display-5 fw-bold text-white mb-2">Global Sports Knowledge Engine</h1>
            <p class="text-secondary mb-4">High-speed C binary indexing with voice recognition & cloud history</p>

            <div class="search-box">
                <i class="bi bi-search text-secondary ms-2 fs-5"></i>
                <input type="text" id="searchInput" class="form-control search-input" placeholder="Search athletes, sports, records (or click the mic)..." autofocus>
                <button type="button" id="voiceBtn" class="voice-btn" onclick="startVoiceSearch()" title="Search by Voice">
                    <i class="bi bi-mic-fill fs-5"></i>
                </button>
                <button type="button" class="search-submit-btn" onclick="performSearch()">Search</button>
            </div>

            <div id="voiceStatus" class="text-info small mt-2 font-monospace d-none"></div>

            <!-- Cloud Search History Chips (Visible when logged in) -->
            <div id="historySection" class="mt-4 text-start d-none">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="text-secondary small fw-semibold text-uppercase">Your Cloud Search History</span>
                    <button class="btn btn-link btn-sm text-secondary text-decoration-none p-0" onclick="clearSearchHistory()">Clear</button>
                </div>
                <div id="historyList" class="d-flex flex-wrap gap-2"></div>
            </div>
        </div>
    </section>

    <!-- Results Section -->
    <main class="container my-4" style="max-width: 800px;">
        <div id="resultsCount" class="text-secondary mb-3 font-monospace small"></div>
        <div id="resultsContainer">
            <div class="text-center text-secondary py-5">
                <h5>Type or use Voice Search above to explore global sports records.</h5>
            </div>
        </div>
    </main>

    <!-- Login / Create Account Modal -->
    <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-glass p-3">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold" id="authModalTitle">Login</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="authError" class="alert alert-danger py-2 small d-none"></div>
                    <form id="authForm" onsubmit="submitAuthForm(event)">
                        <div class="mb-3">
                            <label class="form-label small text-secondary">Username</label>
                            <input type="text" id="authUsername" class="form-control form-control-dark" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-secondary">Password</label>
                            <input type="password" id="authPassword" class="form-control form-control-dark" required>
                        </div>
                        <button type="submit" id="authSubmitBtn" class="btn btn-primary w-100 py-2 fw-semibold rounded-3">Login</button>
                    </form>
                    <p id="authToggleText" class="text-center small text-secondary mt-3 mb-0"></p>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <span>Sportpedia Engine &bull; C Binary Core + Flask Cloud Auth + Web Speech API</span>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
